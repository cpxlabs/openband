name: OpenBand CI V2

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  graph-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run sdd:check
      - run: npm run test:marketing-kb
      - run: npm run marketing:kb:check
      - run: npm run test:graph-sdd
      - run: node --test tests/android-signing-policy.test.mjs
      - run: npm run graph:ci

  security-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm run security:policy

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit

  backend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: cd backend && npm ci && npx tsc --noEmit

  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: cd backend && npm ci
      - run: npx vitest run

  legacy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run test:legacy

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  web-launch-e2e:
    needs: [web-build]
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/launch-first-run.spec.ts

  android-signing-boundary:
    needs: [graph-check, security-policy, frontend-typecheck, backend-typecheck, vitest, legacy-tests, web-build]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'native-build')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - name: Verify Android signing trust boundary
        run: bash scripts/verify-android-signing-boundary.sh

  android-build:
    needs: [graph-check, frontend-typecheck, backend-typecheck, vitest, legacy-tests, web-build, security-policy]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'native-build') || contains(github.event.pull_request.labels.*.name, 'native-build-android')
    runs-on: ubuntu-latest
    env:
      OPENBAND_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - name: Initialize Android evidence
        if: always()
        run: node scripts/native-build-evidence.mjs init --target android --manifest .artifacts/native-build/android.json
      - name: Android preflight
        id: android-preflight
        if: always()
        run: node scripts/native-build-evidence.mjs preflight --target android --manifest .artifacts/native-build/android.json
      - name: Build Android verification APK
        id: android-build-command
        if: always() && steps.android-preflight.outcome == 'success'
        run: |
          npm ci
          cd android
          ./gradlew assembleRelease
      - name: Collect Android evidence
        if: always()
        run: node scripts/native-build-evidence.mjs collect --target android --manifest .artifacts/native-build/android.json --build-outcome "${{ steps.android-build-command.outcome }}"
      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-android-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/native-build/android.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-android-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 14
      - name: Enforce Android evidence
        if: always()
        run: node scripts/native-build-evidence.mjs enforce --manifest .artifacts/native-build/android.json

  electron-build:
    needs: [graph-check, frontend-typecheck, backend-typecheck, vitest, legacy-tests, web-build, security-policy]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'native-build') || contains(github.event.pull_request.labels.*.name, 'native-build-electron')
    runs-on: ubuntu-latest
    env:
      OPENBAND_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - name: Initialize Electron evidence
        if: always()
        run: node scripts/native-build-evidence.mjs init --target electron --manifest .artifacts/native-build/electron.json
      - name: Electron preflight
        id: electron-preflight
        if: always()
        run: node scripts/native-build-evidence.mjs preflight --target electron --manifest .artifacts/native-build/electron.json
      - name: Build Electron Linux verification artifacts
        id: electron-build-command
        if: always() && steps.electron-preflight.outcome == 'success'
        run: |
          npm ci
          npm run build
          cd electron
          npm ci
          npm run build:linux
      - name: Collect Electron evidence
        if: always()
        run: node scripts/native-build-evidence.mjs collect --target electron --manifest .artifacts/native-build/electron.json --build-outcome "${{ steps.electron-build-command.outcome }}"
      - name: Upload Electron evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-electron-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/native-build/electron.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload Electron Linux distributables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-electron-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            electron/out/*.AppImage
            electron/out/*.deb
          if-no-files-found: ignore
          retention-days: 14
      - name: Enforce Electron evidence
        if: always()
        run: node scripts/native-build-evidence.mjs enforce --manifest .artifacts/native-build/electron.json
  merge-gate:
    needs: [graph-check, security-policy, frontend-typecheck, backend-typecheck, vitest, legacy-tests, web-build, web-launch-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Evaluate common exact-run evidence
        env:
          OPENBAND_CI_EVIDENCE: ${{ toJSON(needs) }}
        run: npm run merge:gate
